<!doctype html>
<html>

<head>
  <title>Todo App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
  <h1>the added commit</h1>
  <h1 class="text-4xl text-center mt-6 font-bold">Todo App</h1>


  <!-- LIST -->
  <div class="w-1/2 mx-auto mt-10">
    {% for t in todo_lists %}
    <div class="bg-gray-100 p-3 mt-2 flex justify-between items-center">

      <a href="/todos/{{t.id}}/" class="font-bold">
        {{t.title}}
      </a>

      <div class="flex gap-2">
        <a href="/todos/{{t.id}}/edit/" class="bg-blue-500 text-white px-3">Edit</a>
        <a href="/todos/{{t.id}}/delete/" class="bg-red-500 text-white px-3">Delete</a>
      </div>

    </div>
    {% endfor %}
  </div>

</body>

</html>
